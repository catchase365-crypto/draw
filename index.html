<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>纤细笔锋小黑板 (滚动修复版)</title>
    <style>
        /* 基础设置 */
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; /* 防止整个页面弹性滚动 */
            background-color: #000; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        }

        /* --- 核心修复：只在画布上禁止触摸滚动 --- */
        #drawing-board { 
            display: block; 
            width: 100vw; height: 100vh; 
            background-color: #000;
            touch-action: none; /* 关键：画布区域完全接管触摸，禁止浏览器处理 */
        }
        
        .controls {
            position: fixed; bottom: 30px; left: 0; right: 0;
            display: flex; justify-content: center; align-items: center;
            gap: 20px; pointer-events: none; z-index: 100;
        }
        .btn {
            width: 55px; height: 55px; border-radius: 50%; background-color: #222;
            border: 2px solid #333; color: #eee; display: flex; align-items: center;
            justify-content: center; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            pointer-events: auto; transition: all 0.1s; font-size: 22px; cursor: pointer;
        }
        .btn:active { transform: scale(0.9); background-color: #444; }
        .btn.active-mode { border-color: #0f0; color: #0f0; background-color: #1a3a1a; }
        .rect-btn { border-radius: 12px; }

        /* 底部防误触区域 */
        .safe-area-guard {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 95px; /* 覆盖按钮及其下方区域 */
            z-index: 80; /* 在画布之上，按钮之下 */
            pointer-events: auto; 
            background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 100%);
        }

        /* --- 风格选择菜单修复版 --- */
        #style-menu {
            position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%) scale(0.9);
            width: 92%; max-width: 500px; height: 50vh;
            background: rgba(25, 25, 25, 0.98); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid #444; border-radius: 20px; 
            display: none; flex-direction: row; overflow: hidden; 
            z-index: 2000; /* 确保在最上层 */
            box-shadow: 0 15px 50px rgba(0,0,0,0.9); 
            opacity: 0; transition: opacity 0.2s, transform 0.2s;
            pointer-events: none; /* 默认不响应点击，防止隐藏时误触 */
            touch-action: none; /* 整体禁止外层滑动，内层单独处理 */
        }
        #style-menu.show { display: flex; opacity: 1; transform: translateX(-50%) scale(1); pointer-events: auto; }

        .menu-sidebar {
            width: 85px; background: #151515; border-right: 1px solid #333;
            overflow-y: auto; flex-shrink: 0; display: flex; flex-direction: column;
            -webkit-overflow-scrolling: touch;
        }
        .category-btn {
            padding: 12px 5px; text-align: center; color: #777; font-size: 11px;
            cursor: pointer; border-bottom: 1px solid #222; display: flex; flex-direction: column; align-items: center;
        }
        .category-btn.active {
            background: #222; color: #0f0; border-left: 3px solid #0f0;
        }
        .category-btn span:first-child { font-size: 22px; }

        .menu-content {
            flex: 1; overflow-y: auto; padding: 12px; display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px; align-content: start; -webkit-overflow-scrolling: touch;
            touch-action: pan-y; /* 允许详情列表垂直滚动 */
        }
        
        .style-option {
            padding: 12px 8px; color: #ccc; border-radius: 12px; background: #333; 
            border: 1px solid #444; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; gap: 4px; text-align: center;
        }
        .style-option.active { border-color: #0f0; color: #fff; background: #1a3a1a; }
        .style-option .icon { font-size: 24px; }
        
        .style-option {
            padding: 16px; color: #ddd; border-radius: 10px; cursor: pointer;
            font-size: 15px; display: flex; justify-content: space-between; align-items: center;
            background: #252525; border: 1px solid transparent; 
            flex-shrink: 0; /* 防止子元素被挤压 */
        }
        .style-option:active { background: #444; }
        .style-option.active { border-color: #0f0; color: #fff; background: #1a3a1a; }
        .style-option span:last-child { font-size: 20px; }

        /* AI 覆盖层 */
        #ai-overlay { 
            position: absolute; pointer-events: none; z-index: 50; display: none; 
            object-fit: contain; transform-origin: top left; background-color: #000;
        }

        /* 提示与弹窗 */
        #loading-toast { 
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%); 
            background: rgba(0,0,0,0.9); color: #0f0; padding: 15px 25px; 
            border-radius: 30px; font-size: 14px; display: none; z-index: 200; 
            border: 1px solid #333; box-shadow: 0 0 20px rgba(0, 255, 0, 0.2); 
            text-align: center; white-space: nowrap;
        }
        #api-modal { 
            position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); 
            width: 90%; max-width: 300px; background: #222; padding: 20px; 
            border-radius: 16px; border: 1px solid #444; display: none; 
            flex-direction: column; gap: 15px; z-index: 300; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.9); 
        }
        #api-modal h3 { margin: 0; color: #fff; font-size: 16px; text-align: center; }
        #api-modal input { background: #111; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 8px; outline: none; width: 100%; }
        #api-modal button { background: #333; color: #fff; border: none; padding: 10px; border-radius: 8px; width: 100%; margin-top: 5px; font-weight: bold; }
        
        .shake { animation: shake 0.5s; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } 100% { transform: translateX(0); } }
    </style>
</head>
<body>
    <canvas id="drawing-board"></canvas>
    <div class="safe-area-guard"></div>
    <img id="ai-overlay" alt="AI Result" />
    
    <div id="loading-toast">
        <div id="loading-text">🎨 AI 正在绘图...</div>
    </div>

    <div id="style-menu">
        <div class="menu-sidebar" id="category-list"></div>
        <div class="menu-content" id="style-list"></div>
    </div>
    
    <div id="api-modal">
        <h3>设置 Gemini API Key</h3>
        <input type="password" id="apiKeyInput" placeholder="粘贴 Key">
        <button id="saveKeyBtn" style="background:#060">保存</button>
        <button id="closeKeyBtn">关闭</button>
    </div>

    <div class="controls">
        <div class="btn" id="undoBtn"><span>↩️</span></div>
        <div class="btn" id="redoBtn"><span>↪️</span></div>
        <div class="btn" id="clearBtn"><span>🗑️</span></div>
        <div class="btn rect-btn" id="magicBtn"><span>✨</span></div>
        <div class="btn" id="eraserBtn" title="橡皮擦"><span>🧽</span></div>
        <div class="btn" id="stylusBtn" title="手写笔模式"><span>🖐️</span></div>
        <div class="btn rect-btn" id="exportBtn"><span>💾</span></div>
        <div class="btn rect-btn" id="fullscreenBtn"><span>⛶</span></div>
    </div>

<script>
    const canvas = document.getElementById('drawing-board');
    const ctx = canvas.getContext('2d', { desynchronized: true });
    
    // --- 绘画核心 ---
    let points = [];
    let allPaths = [];
    let currentPath = null;
    let isDrawing = false;
    let currentWidth = 1.0; 
    let stylusOnlyMode = false;
    let isEraserMode = false;
    const MAX_WIDTH = 2.8; const MIN_WIDTH = 0.6; const SMOOTH_FACTOR = 0.7;

    // --- 历史记录与持久化 ---
    let history = [];
    let historyIndex = -1;

    function saveHistory() {
        historyIndex++;
        history.splice(historyIndex);
        history.push(JSON.stringify(allPaths));
        if (history.length > 50) { history.shift(); historyIndex--; }
        localStorage.setItem('chalkboard_data', JSON.stringify(allPaths));
    }

    function undo() {
        if (historyIndex > 0) {
            historyIndex--;
            allPaths = JSON.parse(history[historyIndex]);
            redraw();
            localStorage.setItem('chalkboard_data', JSON.stringify(allPaths));
        }
    }

    function redo() {
        if (historyIndex < history.length - 1) {
            historyIndex++;
            allPaths = JSON.parse(history[historyIndex]);
            redraw();
            localStorage.setItem('chalkboard_data', JSON.stringify(allPaths));
        }
    }

    function pointToSegDist(p, a, b) {
        let l2 = Math.pow(a.x - b.x, 2) + Math.pow(a.y - b.y, 2);
        if (l2 == 0) return Math.sqrt(Math.pow(p.x - a.x, 2) + Math.pow(p.y - a.y, 2));
        let t = ((p.x - a.x) * (b.x - a.x) + (p.y - a.y) * (b.y - a.y)) / l2;
        t = Math.max(0, Math.min(1, t));
        return Math.sqrt(Math.pow(p.x - (a.x + t * (b.x - a.x)), 2) + Math.pow(p.y - (a.y + t * (b.y - a.y)), 2));
    }

    function redraw() {
        ctx.clearRect(0, 0, canvas.width / (window.devicePixelRatio || 1), canvas.height / (window.devicePixelRatio || 1));
        allPaths.forEach(path => {
            if (path.points.length < 2) return;
            ctx.beginPath();
            ctx.lineWidth = path.width;
            const pts = path.points;
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length - 1; i++) {
                const mid = { x: (pts[i].x + pts[i+1].x) / 2, y: (pts[i].y + pts[i+1].y) / 2 };
                ctx.quadraticCurveTo(pts[i].x, pts[i].y, mid.x, mid.y);
            }
            ctx.stroke();
        });
    }

    function resizeCanvas() {
        const dpr = window.devicePixelRatio || 1;
        const { width, height } = document.documentElement.getBoundingClientRect();
        
        const temp = document.createElement('canvas');
        temp.width = canvas.width; temp.height = canvas.height;
        if(canvas.width > 0) temp.getContext('2d').drawImage(canvas, 0, 0);

        canvas.width = width * dpr; canvas.height = height * dpr;
        canvas.style.width = width + 'px'; canvas.style.height = height + 'px';

        ctx.scale(dpr, dpr); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        
        const grad = ctx.createLinearGradient(0, 0, width, height);
        grad.addColorStop(0, '#ff3e3e'); grad.addColorStop(0.2, '#fbff00');
        grad.addColorStop(0.4, '#3eff53'); grad.addColorStop(0.6, '#3e93ff');
        grad.addColorStop(0.8, '#b83eff'); grad.addColorStop(1, '#ff3ed5');
        ctx.strokeStyle = grad; ctx.shadowBlur = 0.5; ctx.shadowColor = 'rgba(255,255,255,0.2)';

        if(allPaths.length > 0) redraw();
        else {
            const saved = localStorage.getItem('chalkboard_data');
            if (saved) {
                allPaths = JSON.parse(saved);
                history = [saved];
                historyIndex = 0;
                redraw();
            } else if (history.length === 0) {
                saveHistory();
            }
        }
    }

    function getInput(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: e.clientX - rect.left,
            y: e.clientY - rect.top,
            force: e.pressure !== undefined ? e.pressure : (e.force || 0),
            time: Date.now(),
            pointerType: e.pointerType,
            buttons: e.buttons
        };
    }

    // --- 绘画事件监听 (关键修复：只监听 Canvas) ---
    function startDrawing(e) {
        if (document.getElementById('ai-overlay').style.display === 'block') return;
        
        // 手写笔模式过滤
        if (stylusOnlyMode && e.pointerType === 'touch') return;
        
        // 如果点击的是菜单，直接退出，允许浏览器处理点击和滚动
        if (e.target.closest('#style-menu') || e.target.closest('.controls') || e.target.closest('#api-modal') || e.target.closest('.safe-area-guard')) {
            return;
        }

        // 如果菜单开着，点别的地方就关掉菜单
        const menu = document.getElementById('style-menu');
        if (menu.classList.contains('show')) {
            menu.classList.remove('show');
            setTimeout(() => { menu.style.display = 'none'; }, 200);
            return;
        }

        const input = getInput(e);
        const isHardwareEraser = input.buttons === 32 || input.pointerType === 'eraser';
        
        if (isEraserMode || isHardwareEraser) {
            isDrawing = true; 
            handleEraser(input);
            if (e.cancelable) e.preventDefault();
            return;
        }

        isDrawing = true;
        currentWidth = 1.5;
        currentPath = { points: [input], width: currentWidth };
        allPaths.push(currentPath);
        points = currentPath.points;
        if (e.cancelable) e.preventDefault();
    }

    function handleEraser(input) {
        const threshold = 6;
        let changed = false;
        const oldLen = allPaths.length;
        allPaths = allPaths.filter(path => {
            for (let i = 0; i < path.points.length - 1; i++) {
                if (pointToSegDist(input, path.points[i], path.points[i+1]) < threshold) {
                    changed = true;
                    return false;
                }
            }
            return true;
        });
        if (changed) {
            redraw();
            saveHistory();
        }
    }

    function draw(e) {
        if (!isDrawing) return;
        const input = getInput(e);
        const isHardwareEraser = input.buttons === 32 || input.pointerType === 'eraser';

        if (isEraserMode || isHardwareEraser) {
            handleEraser(input);
            return;
        }

        if (!currentPath) return;
        points.push(input);
        if (points.length > 2) {
            const p1 = points[points.length - 2], p2 = points[points.length - 1];
            const speed = Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2)) / (p2.time - p1.time || 1);
            let targetWidth = input.force > 0 ? MIN_WIDTH + (MAX_WIDTH - MIN_WIDTH) * input.force : Math.max(MIN_WIDTH, MAX_WIDTH - speed * 0.5);
            currentWidth = currentWidth * SMOOTH_FACTOR + targetWidth * (1 - SMOOTH_FACTOR);
            currentPath.width = currentWidth;
            
            ctx.beginPath(); ctx.lineWidth = currentWidth;
            const mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
            const prev = points.length > 3 ? { x: (points[points.length-3].x + p1.x)/2, y: (points[points.length-3].y + p1.y)/2 } : p1;
            ctx.moveTo(prev.x, prev.y); ctx.quadraticCurveTo(p1.x, p1.y, mid.x, mid.y); ctx.stroke();
        }
        if (e.cancelable) e.preventDefault();
    }

    function stopDrawing() {
        if (isDrawing && currentPath) saveHistory();
        isDrawing = false;
        points = [];
        currentPath = null;
    }

    // 将监听器直接绑定到 Canvas，避免干扰全局
    // 使用 passive: false 允许我们在绘画时调用 preventDefault
    // 使用 Pointer Events 以获得更好的 S-Pen 硬件按钮支持
    canvas.addEventListener('pointerdown', startDrawing);
    canvas.addEventListener('pointermove', draw);
    canvas.addEventListener('pointerup', stopDrawing);
    canvas.addEventListener('pointercancel', stopDrawing);


    // --- AI 核心逻辑 (超级扩充版) ---
    const STYLE_DATA = {

                lava: { l: "熔岩流动", i: "🌋", p: "Molten lava rock. Cracking black crust revealing bright orange magma inside, heat distortion, volcanic texture" },

            }
        },
        "材质工坊": {

            styles: {

                glass: { l: "吹制玻璃", i: "🍶", p: "Hand-blown glass art. Smooth curves, caustics, dispersion of light, semi-transparent colorful glass" },

        },

    let currentStyleKey = 'neon'; 
    let currentStylePrompt = STYLE_DATA['光影能量'].styles['neon'].p;
    const styleMenu = document.getElementById('style-menu');

    const styList = document.getElementById('style-list');

    function showToast(msg, duration = 2000) {
        const t = document.getElementById('loading-toast');
        const txt = document.getElementById('loading-text');
        txt.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => { if(txt.innerText === msg) t.style.display = 'none'; }, duration);
    }

    // 初始化菜单
    function initMenu() {
        const cats = Object.keys(STYLE_DATA);
        cats.forEach((cat, idx) => {
            const btn = document.createElement('div');
            btn.className = `category-btn ${idx===0?'active':''}`;
            btn.innerHTML = `<span>${STYLE_DATA[cat].icon}</span><span>${cat}</span>`;
            btn.onclick = () => renderStyles(cat, btn);
            catList.appendChild(btn);
        });
        renderStyles(cats[0]);
    }

    function renderStyles(catKey, btnElement) {
        if(btnElement) {
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
        }
        styList.innerHTML = '';
        const styles = STYLE_DATA[catKey].styles;
        Object.keys(styles).forEach(key => {
            const s = styles[key];
            const d = document.createElement('div');
            d.className = `style-option ${key === currentStyleKey ? 'active' : ''}`;
            d.innerHTML = `<span class="icon">${s.i}</span><span>${s.l}</span>`;
            d.onclick = () => {
                document.querySelectorAll('.style-option').forEach(o => o.classList.remove('active'));
                d.classList.add('active');
                currentStyleKey = key;
                currentStylePrompt = s.p;
                
                // 提示当前风格
                showToast(`🎨 已切换风格：${s.l}`);
                
                // 关闭菜单并清理状态，防止误触
                styleMenu.classList.remove('show');
                setTimeout(() => { styleMenu.style.display = 'none'; }, 200);
                
                setTimeout(() => runAI(), 100);
            };
            styList.appendChild(d);
        });
    }

    // 初始化调用
    initMenu();

    // 魔法按钮长按逻辑
    const magicBtn = document.getElementById('magicBtn');
    let magicTimer = null;
    let isMagicLong = false;

    const handleMagicStart = (e) => {
        // 仅当点击 ✨ 按钮本身时拦截，防止影响其他层
        if(e.cancelable) e.preventDefault();
        isMagicLong = false;
        magicBtn.style.transform = "scale(0.9)";
        
        if (magicTimer) clearTimeout(magicTimer);
        magicTimer = setTimeout(() => {
            isMagicLong = true;
            styleMenu.classList.add('show');
            // 强制渲染一次，解决部分平板 display 切换延迟
            styleMenu.style.display = 'flex';
            if(navigator.vibrate) navigator.vibrate(50);
        }, 250); 
    };

    const handleMagicEnd = (e) => {
        magicBtn.style.transform = "scale(1)";
        if (magicTimer) clearTimeout(magicTimer);
        
        if (!isMagicLong) {
            if (styleMenu.classList.contains('show')) {
                styleMenu.classList.remove('show');
                setTimeout(() => { styleMenu.style.display = 'none'; }, 200);
            } else {
                runAI();
            }
        }
    };

    magicBtn.addEventListener('mousedown', handleMagicStart);
    magicBtn.addEventListener('touchstart', handleMagicStart, {passive:false});
    magicBtn.addEventListener('mouseup', handleMagicEnd);
    magicBtn.addEventListener('touchend', handleMagicEnd);

    async function runAI() {
        const key = localStorage.getItem('gemini_key');
        if (!key) {
            document.getElementById('api-modal').style.display = 'flex';
            return;
        }

        const bounds = getDrawingBounds();
        if (!bounds) return;

        const loading = document.getElementById('loading-toast');
        const loadingText = document.getElementById('loading-text');
        const aiOverlay = document.getElementById('ai-overlay');

        const tempC = document.createElement('canvas');
        tempC.width = bounds.w; tempC.height = bounds.h;
        const tCtx = tempC.getContext('2d');
        tCtx.fillStyle = '#000000'; 
        tCtx.fillRect(0,0,bounds.w,bounds.h);
        tCtx.drawImage(canvas, bounds.l, bounds.t, bounds.w, bounds.h, 0, 0, bounds.w, bounds.h);
        const base64Img = tempC.toDataURL('image/png').split(',')[1];

        loading.style.display = 'block';
        loadingText.innerText = `AI 正在构想...`; // 简化提示，因为DOM结构已变

        const stylePrompt = currentStylePrompt;
        const fullPrompt = `${stylePrompt} The input image is a rough sketch. Your task is to generate a FULLY RENDERED version in the specified style. The background MUST be solid pure black (#000000). Do NOT show any of the original sketch lines or brush strokes in the result. Replace the sketch entirely with a high-quality solid object. Output image only.`;

        const MODEL_NAME = 'gemini-2.5-flash-image'; 

        try {
            const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${key}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: fullPrompt },
                            { inline_data: { mime_type: "image/png", data: base64Img } }
                        ]
                    }],
                    generationConfig: {
                        responseModalities: ['IMAGE'], 
                        temperature: 1.0
                    }
                })
            });

            const data = await resp.json();
            if (data.error) throw new Error(data.error.message);

            let aiBase64 = null;
            if (data.candidates?.[0]?.content?.parts) {
                const part = data.candidates[0].content.parts.find(p => p.inline_data || p.inlineData);
                if (part) aiBase64 = (part.inline_data || part.inlineData).data;
            }

            if (!aiBase64) throw new Error("AI没有返回图片数据");

            const binStr = atob(aiBase64);
            const len = binStr.length;
            const bytes = new Uint8Array(len);
            for (let i=0; i<len; i++) bytes[i] = binStr.charCodeAt(i);
            const blob = new Blob([bytes], {type: 'image/png'});
            
            aiOverlay.onload = () => {
                const dpr = window.devicePixelRatio || 1;
                aiOverlay.style.left = (bounds.l / dpr) + 'px';
                aiOverlay.style.top = (bounds.t / dpr) + 'px';
                aiOverlay.style.width = (bounds.w / dpr) + 'px';
                aiOverlay.style.height = (bounds.h / dpr) + 'px';
                aiOverlay.style.display = 'block';
                loading.style.display = 'none';
                window.lastAiBlob = blob;
            };
            aiOverlay.src = URL.createObjectURL(blob);

        } catch (e) {
            alert("生成失败: " + e.message);
            loading.style.display = 'none';
        }
    }

    function getDrawingBounds() {
        const dpr = window.devicePixelRatio || 1;
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let l = canvas.width, t = canvas.height, r = 0, b = 0, found = false;
        for (let y = 0; y < canvas.height; y+=4) {
            for (let x = 0; x < canvas.width; x+=4) {
                const idx = (y * canvas.width + x) * 4;
                if (imgData[idx] > 20 || imgData[idx+1] > 20 || imgData[idx+2] > 20) {
                    l = Math.min(l, x); r = Math.max(r, x); t = Math.min(t, y); b = Math.max(b, y); found = true;
                }
            }
        }
        if (!found) return null;
        const p = 20 * dpr;
        return { l: Math.max(0, l-p), t: Math.max(0, t-p), w: Math.min(canvas.width, r+p)-Math.max(0, l-p), h: Math.min(canvas.height, b+p)-Math.max(0, t-p) };
    }

    document.getElementById('exportBtn').onclick = () => {
        const bounds = getDrawingBounds();
        if(!bounds) return;
        const dl = (u, n) => { const a = document.createElement('a'); a.download = n; a.href = u; a.click(); };
        const c = document.createElement('canvas');
        c.width = bounds.w; c.height = bounds.h;
        const cx = c.getContext('2d');
        cx.fillStyle = '#000'; cx.fillRect(0,0,bounds.w,bounds.h);
        cx.drawImage(canvas, bounds.l, bounds.t, bounds.w, bounds.h, 0, 0, bounds.w, bounds.h);
        dl(c.toDataURL(), `手绘_${Date.now()}.png`);
        if (window.lastAiBlob) setTimeout(() => dl(URL.createObjectURL(window.lastAiBlob), `AI_${Date.now()}.png`), 300);
    };

    let clrTimer, isClrLong = false;
    const startClr = (e) => {
        if(e.cancelable) e.preventDefault();

            isClrLong = true;
            document.getElementById('ai-overlay').style.display='none';
            window.lastAiBlob = null;
            clearBtn.classList.add('shake'); setTimeout(()=>clearBtn.classList.remove('shake'),250);

        }, 300);
    };
    const endClr = () => {
        clearBtn.style.transform="scale(1)"; clearTimeout(clrTimer);
        if(!isClrLong) {
            if (allPaths.length === 0) return;
            // 实现“只能点一次上一步”：清除前存一个状态，清除后存一个，并截断其他历史
            const preClearState = JSON.stringify(allPaths);
            allPaths = [];
            ctx.clearRect(0,0,canvas.width,canvas.height);
            document.getElementById('ai-overlay').style.display='none';
            window.lastAiBlob = null;
            localStorage.removeItem('chalkboard_data');
            history = [preClearState, JSON.stringify([])];
            historyIndex = 1;
        }
    };
    clearBtn.addEventListener('mousedown', startClr); clearBtn.addEventListener('touchstart', startClr, {passive:false});
    clearBtn.addEventListener('mouseup', endClr); clearBtn.addEventListener('touchend', endClr);
